<!DOCTYPE html>
<html lang="es" class="h-full">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portal Médico | Clínica Dental Santa Clara</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
        }
    </script>
</head>
<body class="h-full bg-slate-50 dark:bg-slate-950 text-slate-800 dark:text-slate-100 flex flex-col justify-between font-sans antialiased transition-colors duration-300">

    <!-- Header superior minimalista con tuerca y regresar -->
    <header class="p-4 flex justify-between items-center max-w-7xl w-full mx-auto">
        <a href="index.html" class="flex items-center space-x-2 text-slate-600 dark:text-slate-400 hover:text-blue-600 dark:hover:text-blue-400 text-sm font-semibold transition">
            <svg class="w-4 h-4 stroke-current" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <line x1="19" y1="12" x2="5" y2="12"></line>
                <polyline points="12 19 5 12 12 5"></polyline>
            </svg>
            <span data-es="Volver a la clínica" data-en="Back to clinic">Volver a la clínica</span>
        </a>

        <!-- Ajustes rápidos (Tuerca) -->
        <div class="relative">
            <button id="config-dropdown-btn" onclick="toggleConfigMenu()" class="p-2 rounded-lg border border-slate-200 dark:border-slate-800 bg-white dark:bg-slate-900 text-slate-700 dark:text-slate-200 hover:bg-slate-100 dark:hover:bg-slate-800 transition shadow-sm">
                <svg class="w-5 h-5 stroke-current" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <circle cx="12" cy="12" r="3"></circle>
                    <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"></path>
                </svg>
            </button>
            <div id="config-dropdown" class="hidden absolute right-0 top-12 w-48 bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 rounded-xl shadow-xl py-2 z-50 transition-all">
                <button id="theme-toggle" class="w-full text-left px-4 py-2 text-sm text-slate-700 dark:text-slate-200 hover:bg-slate-100 dark:hover:bg-slate-800 transition flex items-center justify-between">
                    <span id="theme-text" data-es="Modo Oscuro" data-en="Dark Mode">Modo Oscuro</span>
                    <span id="theme-icon" class="flex items-center justify-center"></span>
                </button>
            </div>
        </div>
    </header>

    <!-- Tarjeta Principal de Login Médico -->
    <main class="flex-grow flex items-center justify-center px-4 py-8">
        <div class="w-full max-w-md bg-white dark:bg-slate-900 border border-slate-200/80 dark:border-slate-800 rounded-3xl shadow-xl p-8 transition-colors duration-300">
            
            <!-- Encabezado del Formulario -->
            <div class="text-center mb-8">
                <div class="w-14 h-14 bg-emerald-100 dark:bg-emerald-950/70 text-emerald-600 dark:text-emerald-400 rounded-2xl flex items-center justify-center mx-auto mb-4 border border-emerald-200 dark:border-emerald-800/50">
                    <svg class="w-7 h-7 stroke-current" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M22 12h-4l-3 9L9 3l-3 9H2"></path>
                    </svg>
                </div>
                <h1 class="text-2xl font-bold text-slate-900 dark:text-white">Portal del Especialista</h1>
                <p class="text-sm text-slate-500 dark:text-slate-400 mt-1">Acceso privado para médicos de la clínica</p>
            </div>

            <!-- Formulario de Acceso -->
            <form action="#" method="POST" class="space-y-5" onsubmit="event.preventDefault(); alert('Login procesado (Backend listo para conectar)');">
                
                <!-- Campo Cédula / Correo -->
                <div>
                    <label for="email" class="block text-xs font-semibold uppercase tracking-wider text-slate-600 dark:text-slate-400 mb-2">
                        Correo o Cédula Profesional
                    </label>
                    <div class="relative">
                        <input type="text" id="email" required placeholder="dr.ejemplo@santaclara.com" class="w-full px-4 py-3 rounded-xl border border-slate-200 dark:border-slate-800 bg-slate-50 dark:bg-slate-950 text-slate-900 dark:text-white placeholder-slate-400 focus:outline-none focus:border-emerald-500 dark:focus:border-emerald-500 focus:ring-1 focus:ring-emerald-500 text-sm transition">
                    </div>
                </div>

                <!-- Campo Contraseña -->
                <div>
                    <div class="flex justify-between items-center mb-2">
                        <label for="password" class="block text-xs font-semibold uppercase tracking-wider text-slate-600 dark:text-slate-400">
                            Contraseña
                        </label>
                        <a href="#" class="text-xs text-emerald-600 dark:text-emerald-400 hover:underline">¿Olvidaste tu acceso?</a>
                    </div>
                    <div class="relative">
                        <input type="password" id="password" required placeholder="••••••••••••" class="w-full px-4 py-3 rounded-xl border border-slate-200 dark:border-slate-800 bg-slate-50 dark:bg-slate-950 text-slate-900 dark:text-white placeholder-slate-400 focus:outline-none focus:border-emerald-500 dark:focus:border-emerald-500 focus:ring-1 focus:ring-emerald-500 text-sm transition">
                    </div>
                </div>

                <!-- Checkbox Recordar Sesión -->
                <div class="flex items-center justify-between text-xs text-slate-600 dark:text-slate-400 pt-1">
                    <label class="flex items-center space-x-2 cursor-pointer">
                        <input type="checkbox" class="rounded border-slate-300 dark:border-slate-700 text-emerald-600 focus:ring-emerald-500 bg-slate-100 dark:bg-slate-800">
                        <span>Mantener sesión iniciada</span>
                    </label>
                </div>

                <!-- Botón Enviar -->
                <button type="submit" class="w-full bg-emerald-600 hover:bg-emerald-700 text-white font-bold py-3 rounded-xl shadow-lg hover:shadow-emerald-600/20 transition duration-200 text-sm flex items-center justify-center space-x-2">
                    <span>Ingresar al Portal</span>
                    <svg class="w-4 h-4 stroke-current" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <line x1="5" y1="12" x2="19" y2="12"></line>
                        <polyline points="12 5 19 12 12 19"></polyline>
                    </svg>
                </button>
            </form>

            <!-- Notificación de Seguridad -->
            <div class="mt-6 pt-6 border-t border-slate-100 dark:border-slate-800 text-center">
                <p class="text-[11px] text-slate-400 flex items-center justify-center space-x-1">
                    <svg class="w-3.5 h-3.5 stroke-current text-slate-400" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
                        <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
                    </svg>
                    <span>Conexión encriptada de grado médico SSL</span>
                </p>
            </div>

        </div>
    </main>

    <!-- Footer minimalista -->
    <footer class="py-4 text-center text-xs text-slate-400 dark:text-slate-600">
        &copy; 2026 Clínica Dental Santa Clara • Sistema SaaS Médico
    </footer>

    <!-- Lógica de Tema Oscuro y Menú de Ajustes -->
    <script>
        function toggleConfigMenu() {
            document.getElementById('config-dropdown').classList.toggle('hidden');
        }

        const themeToggleBtn = document.getElementById('theme-toggle');
        const themeIconContainer = document.getElementById('theme-icon');
        const themeText = document.getElementById('theme-text');

        const sunIcon = `<svg class="w-5 h-5 stroke-current text-amber-500" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="5"></circle><line x1="12" y1="1" x2="12" y2="3"></line><line x1="12" y1="21" x2="12" y2="23"></line><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line><line x1="1" y1="12" x2="3" y2="12"></line><line x1="21" y1="12" x2="23" y2="12"></line><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line></svg>`;
        const moonIcon = `<svg class="w-5 h-5 stroke-current text-blue-400" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path></svg>`;

        function updateThemeUI(isDark) {
            if (isDark) {
                document.documentElement.classList.add('dark');
                themeIconContainer.innerHTML = sunIcon;
                themeText.textContent = 'Modo Claro';
            } else {
                document.documentElement.classList.remove('dark');
                themeIconContainer.innerHTML = moonIcon;
                themeText.textContent = 'Modo Oscuro';
            }
        }

        const isDarkMode = localStorage.getItem('color-theme') === 'dark' || 
            (!('color-theme' in localStorage) && window.matchMedia('(prefers-color-scheme: dark)').matches);
        updateThemeUI(isDarkMode);

        themeToggleBtn.addEventListener('click', function () {
            const currentlyDark = document.documentElement.classList.contains('dark');
            const nextState = !currentlyDark;
            localStorage.setItem('color-theme', nextState ? 'dark' : 'light');
            updateThemeUI(nextState);
        });
    </script>
</body>
</html>
